<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lena stellt vor – Dr. Irena Schindler</title>
<meta name="robots" content="noindex">
<style>
:root{--gold:#d4a90a;--gold2:#f2c94c;--ink:#08080a;--line:rgba(255,255,255,.1);--muted:#a9a59a;--serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--ink);color:#f4f1e8;font-family:var(--sans);overflow:hidden}
#stars{position:fixed;inset:0;width:100%;height:100%}
.glow{position:fixed;width:700px;height:700px;right:-200px;top:-120px;border-radius:50%;background:radial-gradient(circle,rgba(212,169,10,.28),transparent 65%);filter:blur(60px);animation:f 14s ease-in-out infinite}
@keyframes f{50%{transform:translate(-40px,60px) scale(1.1)}}
.stage{position:relative;z-index:2;height:100%;display:grid;grid-template-columns:minmax(260px,32%) 1fr;gap:3vw;padding:4vh 4vw 9vh}
.lena{align-self:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.frame{width:100%;aspect-ratio:3/4;max-height:68vh;border-radius:28px;border:1px solid rgba(212,169,10,.55);box-shadow:0 0 0 6px rgba(212,169,10,.06),0 30px 90px rgba(212,169,10,.25);
  background:radial-gradient(circle at 50% 35%,rgba(242,201,76,.25),rgba(8,8,10,.95) 65%);display:grid;place-items:center;overflow:hidden;position:relative}
.frame video{width:100%;height:100%;object-fit:cover}
.orb{width:42%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold2),var(--gold) 45%,#4a3a00);box-shadow:0 0 80px rgba(212,169,10,.7)}
.speaking .orb{animation:talk .45s ease-in-out infinite alternate}@keyframes talk{to{transform:scale(1.08);box-shadow:0 0 130px rgba(242,201,76,.9)}}
.name{font:600 22px var(--serif)}.name small{display:block;font:500 12px var(--sans);letter-spacing:.18em;color:var(--gold2);text-align:center}
.slide{align-self:center;max-width:880px}
.kicker{color:var(--gold);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:13px;display:flex;gap:12px;align-items:center}
.kicker:before{content:"";width:30px;height:1px;background:var(--gold)}
h1{font:600 clamp(34px,5.4vw,72px)/1.05 var(--serif);margin:18px 0 14px}
.em{font:italic 600 clamp(22px,2.6vw,34px)/1.25 var(--serif);color:var(--gold);text-shadow:0 0 30px rgba(212,169,10,.45);margin-bottom:22px}
ul{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:12px}
li{font-size:clamp(16px,1.5vw,21px);padding-left:30px;position:relative;color:#e6e1d4}
li:before{content:"";position:absolute;left:0;top:.55em;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px var(--gold)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:20px}
.stat{border:1px solid var(--line);border-radius:20px;padding:20px;background:rgba(255,255,255,.03)}
.stat b{display:block;font:600 clamp(30px,3.4vw,46px) var(--serif);color:var(--gold2)}.stat span{color:var(--muted)}
.tl{margin-top:18px;border-left:2px solid var(--gold);padding-left:22px;display:grid;gap:14px}
.tl div{display:grid;grid-template-columns:120px 1fr;gap:14px;font-size:clamp(15px,1.4vw,19px)}.tl small{color:var(--gold2);font-weight:700}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
.step{border:1px solid rgba(212,169,10,.4);border-radius:20px;padding:22px;background:rgba(212,169,10,.05)}
.step i{font-style:normal;display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--gold);color:#111;font-weight:800}
.step h3{margin:12px 0 6px}.step p{margin:0;color:var(--muted)}
.link{margin-top:18px;color:var(--gold2);font-weight:600}
.in>*{animation:up .7s both}.in>*:nth-child(2){animation-delay:.08s}.in>*:nth-child(3){animation-delay:.16s}.in>*:nth-child(4){animation-delay:.24s}.in>*:nth-child(5){animation-delay:.32s}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
.sub{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:3;max-width:min(900px,90vw);text-align:center;font-size:clamp(15px,1.4vw,19px);background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:14px;padding:10px 18px;backdrop-filter:blur(6px)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:12px 4vw;border-top:1px solid var(--line);background:rgba(8,8,10,.7)}
.dots{display:flex;gap:8px}.dots span{width:9px;height:9px;border-radius:50%;background:#333;cursor:pointer}.dots span.on{background:var(--gold);box-shadow:0 0 10px var(--gold)}
button{background:transparent;border:1px solid rgba(212,169,10,.5);color:#f4f1e8;border-radius:999px;padding:8px 16px;font:inherit;cursor:pointer}
button.gold{background:var(--gold);color:#111;font-weight:700;border-color:var(--gold)}
.ctrl{display:flex;gap:8px}
@media (max-width:820px){html,body{overflow:auto}.stage{grid-template-columns:1fr;padding:2vh 16px 34vh;height:auto;min-height:100%}.lena{flex-direction:row;gap:12px}.frame{width:72px;height:72px;aspect-ratio:1;border-radius:50%}.orb{width:60%}.stats,.steps{grid-template-columns:1fr}.tl div{grid-template-columns:1fr;gap:2px}.sub{bottom:62px;font-size:13.5px;max-height:22vh;overflow:auto;width:calc(100vw - 32px)}.dots{display:none}#voice{font-size:0;padding:8px 12px}#voice:before{content:'🔊';font-size:15px}.bar{padding:10px 16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="stars"></canvas><div class="glow"></div>
<div class="stage">
  <div class="lena"><div class="frame" id="frame"><div class="orb"></div></div><div class="name">Lena<small>KI-ASSISTENTIN</small></div></div>
  <div class="slide" id="slide"></div>
</div>
<div class="sub" id="sub"></div>
<div class="bar">
  <div class="ctrl"><button id="prev">←</button><button class="gold" id="play">▶ Start</button><button id="next">→</button></div>
  <div class="dots" id="dots"></div>
  <div class="ctrl"><button id="lang">EN</button><button id="voice">🔊 Browser-Stimme</button></div>
</div>
<script src="slides.js"></script>
<script>
// Stage logic. Integration point for the avatar agent: listen to the "lena:slide" event and speak e.detail.say;
// call window.lenaDone() when finished to advance in auto mode.
const S = window.SLIDES; let i = 0, lang = (new URLSearchParams(location.search).get('lang') === 'en') ? 'en' : 'de', auto = false, browserVoice = false, timer = null;
const $ = id => document.getElementById(id);
function html(c) {
  let h = `<div class="kicker">${c.kicker}</div><h1>${c.h}</h1>`;
  if (c.em) h += `<div class="em">${c.em}</div>`;
  if (c.body) h += `<ul>${c.body.map(b => `<li>${b}</li>`).join('')}</ul>`;
  if (c.stats) h += `<div class="stats">${c.stats.map(([b, s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join('')}</div>`;
  if (c.timeline) h += `<div class="tl">${c.timeline.map(([y, t]) => `<div><small>${y}</small><span>${t}</span></div>`).join('')}</div>`;
  if (c.steps) h += `<div class="steps">${c.steps.map(([n, t, d]) => `<div class="step"><i>${n}</i><h3>${t}</h3><p>${d}</p></div>`).join('')}</div>`;
  if (c.link) h += `<div class="link">→ ${c.link}</div>`;
  return h;
}
function show(n) {
  i = Math.max(0, Math.min(S.length - 1, n)); const c = S[i][lang];
  const el = $('slide'); el.className = 'slide'; el.innerHTML = html(c); void el.offsetWidth; el.className = 'slide in';
  $('dots').innerHTML = S.map((_, k) => `<span class="${k === i ? 'on' : ''}" data-k="${k}"></span>`).join('');
  $('sub').textContent = c.say; document.documentElement.lang = lang;
  window.dispatchEvent(new CustomEvent('lena:slide', {detail: {index: i, id: S[i].id, lang, say: c.say}}));
  if (auto) speak(c.say);
}
function speak(text) {
  clearTimeout(timer); $('frame').classList.add('speaking');
  if (browserVoice && 'speechSynthesis' in window) {
    speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = lang === 'de' ? 'de-DE' : 'en-US'; u.rate = 1.02;
    u.onend = () => window.lenaDone(); speechSynthesis.speak(u);
  } else { timer = setTimeout(() => window.lenaDone(), Math.max(4500, text.length * 62)); }
}
window.lenaDone = () => { $('frame').classList.remove('speaking'); if (auto && i < S.length - 1) setTimeout(() => show(i + 1), 700); else if (i === S.length - 1) { auto = false; $('play').textContent = '▶ Start'; } };
$('next').onclick = () => show(i + 1); $('prev').onclick = () => show(i - 1);
$('dots').onclick = e => e.target.dataset.k && show(+e.target.dataset.k);
$('play').onclick = () => { auto = !auto; $('play').textContent = auto ? '❚❚ Pause' : '▶ Start'; if (auto) speak(S[i][lang].say); else { clearTimeout(timer); if (window.speechSynthesis) speechSynthesis.cancel(); $('frame').classList.remove('speaking'); } };
$('lang').onclick = () => { lang = lang === 'de' ? 'en' : 'de'; $('lang').textContent = lang === 'de' ? 'EN' : 'DE'; show(i); };
$('voice').onclick = () => { browserVoice = !browserVoice; $('voice').style.borderColor = browserVoice ? '#d4a90a' : ''; $('voice').textContent = browserVoice ? '🔊 Stimme an' : '🔊 Browser-Stimme'; };
addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === ' ') show(i + 1); if (e.key === 'ArrowLeft') show(i - 1); });
$('lang').textContent = lang === 'de' ? 'EN' : 'DE'; show(0);
// stars
(() => { const c = $('stars'), x = c.getContext('2d'); let w, h, s;
  const r = () => { w = c.width = innerWidth; h = c.height = innerHeight; s = Array.from({length: 160}, () => ({x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.3 + .3, p: Math.random() * 6, g: Math.random() < .15})); };
  const d = t => { x.clearRect(0, 0, w, h); for (const p of s) { const a = .3 + .4 * Math.sin(t / 900 + p.p); x.fillStyle = p.g ? `rgba(242,201,76,${a})` : `rgba(255,255,255,${a * .7})`; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7); x.fill(); p.y -= .08; if (p.y < 0) p.y = h; } requestAnimationFrame(d); };
  r(); addEventListener('resize', r); requestAnimationFrame(d); })();
</script>
</body>
</html>
